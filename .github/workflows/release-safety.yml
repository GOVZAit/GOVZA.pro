name: Release database safety
on:
  pull_request:
  push:
    branches: [gpt/admin-control-center]
permissions:
  contents: read
concurrency:
  group: release-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govza_release_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      restore-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govza_restore_test
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/govza_release_test
      RESTORE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5433/govza_restore_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Typecheck release tools
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --esModuleInterop --types node script/release-database.ts script/check-release-db.ts script/test-release-database.ts script/test-backup-connection.ts script/test-transport-policy.ts
      - name: Check safe deployment entrypoints and verification syntax
        run: |
          python3 -m py_compile script/verify-publication.py
          node - <<'JS'
          const assert=require('node:assert/strict');const p=require('./package.json');
          assert.equal(p.scripts['db:push'],'tsx script/check-release-db.ts');
          assert.equal(p.scripts['db:check-release'],'tsx script/check-release-db.ts');
          JS
      - name: Verify libpq connection mapping and proxy boundary
        run: npx tsx script/test-backup-connection.ts && npx tsx script/test-transport-policy.ts
      - name: Match PostgreSQL clients to restore fixture version
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Verify schema gate and restore fixtures into empty service database
        run: npx tsx script/test-release-database.ts
